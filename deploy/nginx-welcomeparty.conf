# Isolated SYSU Welcome internal test. Included only in sysuzgxytj.top's HTTPS server.
location ^~ /welcomeparty/api/ {
    proxy_pass http://127.0.0.1:3216/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path / /welcomeparty/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
location ^~ /welcomeparty/ws/ {
    proxy_pass http://127.0.0.1:3216/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
location = /welcomeparty/index.html {
    alias /opt/sysu-welcome-internal/current/frontend/dist/index.html;
    add_header Cache-Control "no-store" always;
}
location ^~ /welcomeparty/ {
    alias /opt/sysu-welcome-internal/current/frontend/dist/;
    try_files $uri $uri/ /welcomeparty/index.html;
    add_header Cache-Control "no-cache" always;
}
