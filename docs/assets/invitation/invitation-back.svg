>
  <title id="back-title">中山大学智能工程学院迎新邀请函背面视觉示意</title>
  <desc id="back-desc">
    A6 横版邀请函背面，说明 NFC、不可扫描的二维码图形占位和短网址三种方式进入同一 welcome 页面；本图为非正式入口和非印刷生产文件。
  </desc>

  <defs>
