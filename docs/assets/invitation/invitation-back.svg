      <stop offset="0.48" stop-color="#0B2542" />
      <stop offset="1" stop-color="#061326" />
    </linearGradient>
    <radialGradient id="back-cyan-haze" cx="0" cy="0" r="1" gradientTransform="translate(745 690) rotate(90) scale(640 870)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34CCFF" stop-opacity="0.13" />
      <stop offset="0.62" stop-color="#237BC5" stop-opacity="0.05" />
      <stop offset="1" stop-color="#061326" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="back-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102E4E" stop-opacity="0.92" />
      <stop offset="1" stop-color="#091C34" stop-opacity="0.92" />
