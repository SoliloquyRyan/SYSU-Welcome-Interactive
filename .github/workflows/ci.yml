name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm build:contracts

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify formal deployment package
        run: pnpm deploy:check && pnpm test:formal:smoke && pnpm test:rehearsal:smoke

      - name: Check documentation
        run: pnpm docs:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck E2E
        run: pnpm typecheck:e2e

      # The repository still contains historical D-106/D-109 scenarios whose
      # assertions describe superseded field flows. Keep the current canonical
      # field acceptance in the CI gate until those historical specs
      # are migrated; the full suite remains available via pnpm test:e2e:all.
      - name: Run current field E2E smoke
        run: pnpm exec playwright test tests/e2e/d119-final-live.spec.ts --project=chromium-ci
