name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: G2 functional verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contracts, backend, tests, and frontend
        run: pnpm verify:g2

      - name: Smoke test one-command startup and clean shutdown
        env:
          DEMO_SMOKE_EXIT_AFTER_READY: '1'
        run: pnpm dev

  browser-acceptance:
    name: G3 browser acceptance (Windows Chromium, Chrome, and Edge)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated Chromium browser
        run: pnpm exec playwright install chromium

      - name: Verify G3 in Chromium, Chrome, and Edge
        run: pnpm test:e2e:all

      - name: Upload sanitized browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-browser-result
          path: tests/reports/g3-browser.json
          if-no-files-found: warn
          retention-days: 7
